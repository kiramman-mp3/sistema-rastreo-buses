# Production stack. Run with:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# First-time setup: scripts/init-prod.sh
name: rastreo-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    profiles: ["local-db"]
    image: ${POSTGRES_IMAGE:-postgres:15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  odoo:
    build:
      context: ./docker/odoo
      args:
        ODOO_IMAGE: ${ODOO_IMAGE:-odoo:16.0}
    image: rastreo-odoo:16.0
    restart: unless-stopped
    command: ["odoo", "-d", "${ODOO_DB:-buses}"]
    environment:
      HOST: ${DB_HOST:-db}
      PORT: ${DB_PORT:-5432}
      USER: ${DB_USER:-odoo}
      PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - ./data:/mnt/data:ro
      - ./config/odoo.prod.conf:/etc/odoo/odoo.conf:ro
    expose:
      - "8069"
      - "8072"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *logging

  traccar:
    image: ${TRACCAR_IMAGE:-traccar/traccar:6.16.0}
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: ${TRACCAR_DATABASE_URL:-jdbc:postgresql://db:5432/traccar}
      DATABASE_USER: ${TRACCAR_DB_USER:-traccar}
      DATABASE_PASSWORD: ${TRACCAR_DB_PASSWORD:?set TRACCAR_DB_PASSWORD in .env.prod}
      DATABASE_MAX_POOL_SIZE: "3"
      FORWARD_ENABLE: "true"
      FORWARD_TYPE: "json"
      FORWARD_RETRY_ENABLE: "true"
      FORWARD_URL: "http://odoo:8069/bus_tracking/traccar/webhook"
      FORWARD_HEADER: "X-Webhook-Secret: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env.prod}"
    expose:
      - "8082"   # Traccar API: reached by Odoo only
      - "5055"   # OsmAnd protocol: reached by the phones through the proxy, over HTTPS
    volumes:
      - traccar-logs:/opt/traccar/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/api/server"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *logging

  # Grafana, the second dashboard, embedded in Odoo. Optional: it starts only with the profile "bi"
  # (COMPOSE_PROFILES=bi in .env.prod, or --profile bi). See docs/guias/GRAFANA.md.
  grafana:
    profiles: ["bi"]
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:11.6.0}
    restart: unless-stopped
    env_file:
      - ./bi/grafana/grafana.env
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:?set GRAFANA_DOMAIN in .env.prod}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.prod}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GRAFANA_DB_HOST: ${DB_HOST:-db}:${DB_PORT:-5432}
      GRAFANA_DB_NAME: ${ODOO_DB:-buses}
      GRAFANA_DB_SSLMODE: ${GRAFANA_DB_SSLMODE:-disable}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env.prod}
      GRAFANA_JWT_SECRET: ${GRAFANA_JWT_SECRET:?set GRAFANA_JWT_SECRET in .env.prod}
    entrypoint: ["/bin/sh", "/etc/grafana/entrypoint.sh"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./bi/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./bi/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./bi/grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *logging

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
      - traccar
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod}
      GPS_DOMAIN: ${GPS_DOMAIN:?set GPS_DOMAIN in .env.prod}
      TRACCAR_DOMAIN: ${TRACCAR_DOMAIN:-traccar.20.119.213.192.nip.io}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  odoo-data:
  traccar-logs:
  grafana-data:
  caddy-data:
  caddy-config:
