# SonarQube analysis of the whole project: the Odoo module (Python, JavaScript, XML), the driver app (TypeScript)
# and the quality and deployment scripts. Run with scripts/sonar-scan.sh (docs/calidad/16-sonarqube.md).
sonar.projectKey=sistema-rastreo-buses
sonar.projectName=Sistema de rastreo de buses
sonar.sourceEncoding=UTF-8

# What is analysed. Tests are listed apart so they count as test code, not as code that needs tests.
sonar.sources=addons/bus_tracking,apps/conductor-tablet/app,apps/conductor-tablet/src,qa,scripts,bi/grafana/entrypoint.sh,docker,proxy
sonar.tests=addons/bus_tracking/tests,apps/conductor-tablet/src
sonar.test.inclusions=addons/bus_tracking/tests/**,apps/conductor-tablet/src/**/*.test.ts

# What is not ours or not code: libraries, translations, generated files, captured evidence.
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/i18n/*.po,**/i18n/*.pot,**/static/lib/**,**/static/description/**,\
  **/dist/**,**/.expo/**,**/coverage/**,qa/recursos/**,qa/salida/**

sonar.python.version=3.9
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=apps/conductor-tablet/coverage/lcov.info
sonar.coverage.exclusions=addons/bus_tracking/tests/**,apps/conductor-tablet/src/**/*.test.ts,qa/**,scripts/**,\
  apps/conductor-tablet/app/**,**/__manifest__.py,**/migrations/**
