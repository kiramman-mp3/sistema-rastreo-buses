name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  mobile-tablet-app:
    name: Conductor Tablet (Expo/TS/Jest/ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/conductor-tablet/package-lock.json'

      - name: Install Tablet Dependencies
        working-directory: apps/conductor-tablet
        run: npm ci

      - name: Lint
        working-directory: apps/conductor-tablet
        run: npm run lint

      - name: TypeScript Typecheck
        working-directory: apps/conductor-tablet
        run: npm run typecheck

      - name: Unit Tests
        working-directory: apps/conductor-tablet
        run: npm test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Reads the checked-out tree, so it does not depend on the history. .gitleaks.toml allows the public
      # CARTO map tile key and nothing else. A leaked secret fails the job: rotate it, deleting it is not enough.
      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1             dir /repo --config /repo/.gitleaks.toml --redact --no-banner --log-level warn

  backend-validation:
    name: Odoo Addon Lint & Translations
    runs-on: ubuntu-latest
    # The odoo:16.0 image runs Python 3.9. setup-python has no 3.9 for Ubuntu 26.04 (ubuntu-latest
    # since October 2026), so the job runs in the official Python 3.9 image instead.
    container: python:3.9-slim

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python Syntax (Compileall)
        run: python -m compileall -q addons/bus_tracking

      - name: Flake8 (module, full rule set from .flake8)
        run: flake8 addons/bus_tracking scripts/dev_seed.py --count --statistics

      - name: Flake8 (qa scripts, errors only)
        run: flake8 qa --select=E9,F --count --show-source

      - name: Spanish translation is complete and current
        run: python -X utf8 qa/traducciones.py

  odoo-tests:
    name: Odoo Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Same image as development: odoo:16.0 plus pywebpush.
      - name: Build the Odoo image
        run: docker build -t rastreo-odoo:ci docker/odoo

      - name: Run the bus_tracking tests
        run: |
          # The image's entrypoint waits for Postgres at $HOST (default "db") before reading --db_host.
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            -v "$PWD/addons:/mnt/extra-addons:ro" \
            rastreo-odoo:ci \
            odoo --db_host=127.0.0.1 --db_port=5432 --db_user=odoo --db_password=odoo \
              --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
              -d buses_ci -i bus_tracking --test-enable --test-tags /bus_tracking \
              --stop-after-init --without-demo=all --no-http 2>&1 | tee odoo-tests.log
          # Odoo does not always exit with an error when a test fails: read its summary line.
          grep -E "odoo.tests.result: 0 failed, 0 error\(s\) of [0-9]+ tests" odoo-tests.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-tests-log
          path: odoo-tests.log
