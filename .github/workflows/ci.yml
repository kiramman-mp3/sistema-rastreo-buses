name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  mobile-tablet-app:
    name: Conductor Tablet (Expo/TS/Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/conductor-tablet/package-lock.json'

      - name: Install Tablet Dependencies
        working-directory: apps/conductor-tablet
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: apps/conductor-tablet
        run: npm run typecheck

      - name: Unit Tests
        working-directory: apps/conductor-tablet
        run: npm test

  backend-validation:
    name: Odoo Addon Syntax & Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Check Python Syntax (Compileall)
        run: python -m compileall addons/bus_tracking

      - name: Flake8 Critical Errors Check
        run: flake8 addons/bus_tracking --count --select=E9,F63,F7,F82 --show-source --statistics
