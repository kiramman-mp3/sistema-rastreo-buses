services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: ./docker/odoo
    image: rastreo-odoo:16.0
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD:-odoo}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
      - ./data:/mnt/data:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf

  traccar:
    # Pinned: the forwarding settings changed between versions (see README). Verified with 6.16.0.
    image: traccar/traccar:6.16.0
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "8082:8082"   # web UI + REST API
      - "5055:5055"   # OsmAnd protocol (phone apps, e.g. Traccar Client)
      - "5023:5023"   # GT06 protocol (common hardware trackers)
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      # Push every position to Odoo as soon as it arrives
      FORWARD_ENABLE: "true"
      FORWARD_TYPE: "json"
      FORWARD_RETRY_ENABLE: "true"
      FORWARD_URL: "http://odoo:8069/bus_tracking/traccar/webhook"
      FORWARD_HEADER: "X-Webhook-Secret: ${WEBHOOK_SECRET:-change-me}"
    volumes:
      - traccar-data:/opt/traccar/data
      - traccar-logs:/opt/traccar/logs

  # Grafana, the second dashboard (profile "bi": docker compose --profile bi up -d grafana).
  # Reads the kpi_* views of Odoo with the read-only role of scripts/grafana-role.sh, and is embedded in Odoo.
  grafana:
    profiles: ["bi"]
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    env_file:
      - ./bi/grafana/grafana.env
    environment:
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GRAFANA_DB_HOST: db:5432
      GRAFANA_DB_NAME: ${ODOO_DB:-buses}
      GRAFANA_DB_SSLMODE: disable
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-dev}
      GRAFANA_JWT_SECRET: ${GRAFANA_JWT_SECRET:-dev-grafana-jwt-secret-change-me}
    entrypoint: ["/bin/sh", "/etc/grafana/entrypoint.sh"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./bi/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./bi/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./bi/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  db-data:
  odoo-data:
  traccar-data:
  traccar-logs:
  grafana-data:
